<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101c42"><title>サンタのプレゼント大作戦 DX Ver.3</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#080e27;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{background:radial-gradient(ellipse at 50% 5%,#314b83,#101831 55%,#080d21)}main{width:min(100%,1100px);margin:auto;padding:8px 12px 12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px}.brand{font-weight:950;font-size:clamp(14px,2.5vw,24px);letter-spacing:.03em;text-shadow:0 2px 10px #ffd98955}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{background:linear-gradient(150deg,#ffffff27,#ffffff0b);border:1px solid #ffffff50;border-radius:999px;padding:6px 12px;font-size:clamp(11px,1.8vw,15px);font-weight:800;box-shadow:inset 0 1px #ffffff44;white-space:nowrap}.pill b{color:#ffe5a2}.stage{position:relative;overflow:hidden;border:3px solid #d4eaff;border-radius:19px;box-shadow:0 0 0 4px #ffffff18,0 15px 48px #020719b8;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none;user-select:none;-webkit-user-select:none}.cover{position:absolute;inset:0;background:linear-gradient(140deg,#07132bc9,#111b47e5);display:flex;align-items:center;justify-content:center;padding:14px;text-align:center}.panel{max-width:560px;padding:15px 25px;border:1px solid #ffffff70;border-radius:22px;background:linear-gradient(155deg,#ffffff2d,#ffffff0b);box-shadow:0 12px 40px #0006, inset 0 1px #ffffff60;backdrop-filter:blur(8px)}.panel h2{font-size:clamp(21px,3.6vw,36px);margin:0 0 8px;color:#ffe9b1;text-shadow:0 2px 8px #0007}.panel p{font-size:clamp(12px,1.9vw,17px);line-height:1.55;margin:0 0 15px}button{cursor:pointer;border:1px solid #ffffff80;border-radius:999px;padding:9px 17px;background:linear-gradient(#ffeeb1,#ffbb6b);color:#493048;font-weight:900;font-size:clamp(12px,1.8vw,16px);box-shadow:0 3px 0 #a76b4b,0 7px 15px #0003;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 1px 0 #a76b4b}button:focus-visible{outline:3px solid white}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}.buttons button{background:linear-gradient(#e8f7ff,#a6d5ed);box-shadow:0 3px 0 #547ba0,0 7px 15px #0003}.tip{text-align:center;color:#d5e9ff;font-size:12px;margin:9px 0 0}.rotate{display:none;position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#304a80,#101831);align-items:center;justify-content:center;text-align:center;padding:30px}.rotate .rotate-inner{border:1px solid #ffffff55;border-radius:24px;padding:26px;background:#ffffff17}.rotate .symbol{font-size:60px;animation:tilt 2s ease-in-out infinite alternate}@keyframes tilt{from{transform:rotate(-25deg)}to{transform:rotate(65deg)}}@media (orientation:portrait) and (max-width:800px) and (pointer:coarse){.rotate{display:none}main:before{content:"📱 横向きにするともっと遊びやすくなります";display:block;text-align:center;padding:5px;font-size:12px;color:#ffe7ac}}@media (orientation:landscape) and (max-height:540px){main{padding:2px 6px}header{margin-bottom:2px}.brand{font-size:13px}.pill{padding:3px 8px;font-size:11px}.stage{width:min(100%,calc((100dvh - 85px)*16/9));margin:auto;border-width:2px;border-radius:10px}.buttons{margin-top:4px;gap:5px}.buttons button{padding:4px 12px;font-size:11px}.tip{display:none}.panel{padding:9px 18px}.panel h2{font-size:21px}.panel p{font-size:12px;margin-bottom:8px}}
</style></head><body><div class="rotate"><div class="rotate-inner"><div class="symbol">📱</div><h2>iPhoneを横向きにしてください</h2><p>横画面でサンタの冒険を楽しもう！ 🎄</p><small>画面の回転ロックがオンの場合は解除してください</small></div></div><main><header><div class="brand">🎅 サンタのプレゼント大作戦 <span style="color:#ffe3a4">DX</span></div><div class="hud"><span class="pill">⭐ <b id="score">0</b></span><span class="pill">🎁 COMBO <b id="combo">0</b></span><span class="pill">🏆 <b id="best">0</b></span></div></header><div class="stage" id="stage"><canvas id="game" width="960" height="540" aria-label="サンタクロースの横スクロールゲーム"></canvas><div class="cover" id="cover"><div class="panel"><h2 id="heading">🎄 サンタのプレゼント大作戦</h2><p id="message">画面を押し続けると上昇、離すと下降！<br>パソコンはスペースキーで操作できます。<br>プレゼントを煙突に届けてコンボをつなごう！<br>雲にぶつかるとコンボがリセットされます。</p><button id="play">🎁 配達スタート！（Ver.3）</button></div></div></div><div class="buttons"><button id="pause">⏸ 一時停止</button><button id="restart">🔄 最初から</button><button id="help">❔ 遊び方</button><button id="finish">🏁 終了</button></div><p class="tip">📱 画面を長押し / 💻 スペースキーを長押しで上昇　・　音なし</p></main><script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),cover=document.querySelector('#cover'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),play=document.querySelector('#play');const W=960,H=540;let score=0,combo=0,best=0,elapsed=0,world=0,dropTimer=0,cloudTimer=0,houseTimer=0,mode='intro',last=0,clouds=[],houses=[],gifts=[],effects=[],snow=[],activePointers=new Set(),keyboardHeld=false;const santa={x:235,y:177,vy:0,immune:0};const R=Math.random;const rand=(a,b)=>a+R()*(b-a);const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const hold=()=>keyboardHeld||activePointers.size>0;
try{best=Number(localStorage.getItem('santa_best_v1'))||0}catch(e){}document.querySelector('#best').textContent=best;for(let i=0;i<100;i++)snow.push({x:R()*W,y:R()*H,r:rand(.7,2.4),s:rand(20,65),a:rand(.35,1)});
function hud(){document.querySelector('#score').textContent=score;document.querySelector('#combo').textContent=combo;document.querySelector('#best').textContent=best}function save(){if(score>best){best=score;try{localStorage.setItem('santa_best_v1',String(best))}catch(e){}}hud()}function panel(title,body,label){heading.textContent=title;message.innerHTML=body;play.textContent=label;cover.style.display='flex'}function clearInput(){activePointers.clear();keyboardHeld=false}function reset(){score=0;combo=0;elapsed=0;world=0;dropTimer=0;cloudTimer=0;houseTimer=0;santa.y=175;santa.vy=0;santa.immune=0;clouds=[];houses=[];gifts=[];effects=[];clearInput();mode='playing';cover.style.display='none';hud();last=performance.now()}function pause(){if(mode==='playing'){mode='paused';clearInput();panel('⏸ ひと休み','サンタとトナカイもひと休み。<br>準備ができたら再開しよう！','▶ 再開')}else if(mode==='paused'){mode='playing';cover.style.display='none';last=performance.now()}}play.addEventListener('click',e=>{e.preventDefault();if(mode==='paused')pause();else reset()});document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=reset;document.querySelector('#finish').onclick=()=>{if(mode==='playing'||mode==='paused'){save();mode='ended';clearInput();panel('🎄 配達おつかれさま！',`スコア：<b>${score}</b>点<br>最高得点：${best}点`,'🔄 もう一度遊ぶ')}};document.querySelector('#help').onclick=()=>{if(mode==='playing')pause();else if(mode==='intro'||mode==='ended'){mode='intro';panel('❔ 遊び方','画面を押し続ける / スペースキー：上昇<br>離す：下降<br>プレゼントは自動投下。煙突に入れば成功！<br>雲にぶつかるとコンボが0になります。','🎁 スタート')}};
// Pointer events are tracked by ID, so a second tap cannot cancel the first hold.
canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;e.preventDefault();activePointers.add(e.pointerId);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{activePointers.delete(e.pointerId)});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('dblclick',e=>e.preventDefault());stage.addEventListener('selectstart',e=>e.preventDefault());window.addEventListener('pointerup',e=>activePointers.delete(e.pointerId));window.addEventListener('pointercancel',e=>activePointers.delete(e.pointerId));window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();keyboardHeld=true}if(e.code==='KeyP'&&!e.repeat)pause()});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();keyboardHeld=false}});window.addEventListener('blur',()=>{clearInput();if(mode==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause()});
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(points,color,width=3){ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}function puff(x,y,color){for(let i=0;i<18;i++)effects.push({x,y,vx:rand(-125,125),vy:rand(-130,85),t:rand(.45,.95),color,r:rand(2,6)})}function addHouse(){houses.push({x:W+80,w:rand(116,155),h:rand(92,142),roof:R()>.5?'#d97090':'#79a6dc',wall:R()>.5?'#f9d4b2':'#d2e4ff',done:false,missed:false})}function addCloud(){clouds.push({x:W+85,y:rand(78,312),w:rand(95,160),h:rand(43,70),hit:false})}
function update(dt){elapsed+=dt;let speed=Math.min(350,145+elapsed*1.6);world+=speed*dt;santa.vy=clamp(santa.vy+(hold()?-570:440)*dt,-255,265);santa.y=clamp(santa.y+santa.vy*dt,64,352);if(santa.y===64||santa.y===352)santa.vy=0;santa.immune=Math.max(0,santa.immune-dt);houseTimer+=dt;cloudTimer+=dt;dropTimer+=dt;if(houseTimer>Math.max(1.7,2.75-elapsed*.006)){houseTimer=0;addHouse()}if(cloudTimer>Math.max(.9,2.9-elapsed*.012)){cloudTimer=0;addCloud()}if(dropTimer>.83){dropTimer=0;gifts.push({x:santa.x+42,y:santa.y+28,vy:90,dead:false,rot:R()*3})}for(const h of houses){h.x-=speed*dt;if(!h.missed&&h.x+h.w<0){h.missed=true;if(!h.done){combo=0;hud()}}}for(const c of clouds){c.x-=speed*dt;if(!c.hit&&santa.immune<=0&&Math.abs(c.x+c.w/2-(santa.x+8))<c.w*.35+41&&Math.abs(c.y-santa.y)<c.h*.4+27){c.hit=true;santa.immune=1.15;combo=0;puff(santa.x,santa.y,'#ffc5d5');hud()}}for(const g of gifts){g.y+=g.vy*dt;g.vy+=205*dt;g.rot+=dt*1.8;for(const h of houses){let chimneyX=h.x+h.w*.67,chimneyTop=H-97-h.h-29;if(!h.done&&g.x>chimneyX-10&&g.x<chimneyX+33&&g.y>=chimneyTop&&g.y<chimneyTop+26){h.done=true;g.dead=true;combo++;score+=100*Math.min(combo,10);save();puff(chimneyX+13,chimneyTop,'#ffe69a');break}}if(g.y>H-90)g.dead=true}for(const p of effects){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}houses=houses.filter(h=>h.x+h.w>-100);clouds=clouds.filter(c=>c.x+c.w>-100);gifts=gifts.filter(g=>!g.dead);effects=effects.filter(p=>p.t>0);for(const s of snow){s.x-=(s.s+speed*.12)*dt;s.y+=s.s*.23*dt;if(s.x<0)s.x=W;if(s.y>H)s.y=0}}
function drawSky(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#09143c');sky.addColorStop(.54,'#35467c');sky.addColorStop(1,'#b2a2c1');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let glow=ctx.createRadialGradient(760,105,12,760,105,270);glow.addColorStop(0,'#ffe9ad3b');glow.addColorStop(1,'#ffe9ad00');ctx.fillStyle=glow;ctx.fillRect(480,0,480,420);ellipse(768,96,42,42,'#fff3c5');ellipse(784,82,38,38,'#17284f');for(let i=0;i<75;i++){let x=((i*179-world*.035)%W+W)%W,y=17+(i*83)%330;let r=i%8===0?2.6:1.2;ellipse(x,y,r,r,i%3===0?'#ffe5b7':'#eaf6ff')}for(let i=0;i<8;i++){let x=((i*231-world*.17)%(W+300)+W+300)%(W+300)-120;ellipse(x,415+(i%3)*9,160,55,'#8195bb55')}ctx.fillStyle='#e1eafb';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=15)ctx.lineTo(x,H-125+Math.sin((x+world*.13)/77)*15);ctx.lineTo(W,H);ctx.fill();ctx.fillStyle='#f7fbff';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=15)ctx.lineTo(x,H-96+Math.sin((x+world*.23)/66)*10);ctx.lineTo(W,H);ctx.fill()}
function drawHouse(h){const y=H-97-h.h,x=h.x,w=h.w;ctx.save();ctx.shadowColor='#09152d55';ctx.shadowBlur=16;roundRect(x,y,w,h.h,8,h.wall);ctx.shadowBlur=0;roundRect(x+8,y+12,w-16,h.h-16,4,'#ffffff24');ctx.fillStyle=h.roof;ctx.beginPath();ctx.moveTo(x-16,y+5);ctx.lineTo(x+w/2,y-52);ctx.lineTo(x+w+16,y+5);ctx.closePath();ctx.fill();line([[x-17,y+5],[x+w/2,y-52],[x+w+17,y+5]],'#fff9ef',9);roundRect(x+w*.67-8,y-54,38,35,4,'#88596a');roundRect(x+w*.67-12,y-58,46,9,5,'#fffafa');for(const wx of [x+19,x+w-48]){roundRect(wx,y+25,30,33,6,'#fff9e4');roundRect(wx+4,y+4+25,22,25,3,h.done?'#b4ffd7':'#ffcf79');line([[wx+15,y+30],[wx+15,y+53]],'#fff6e7',3);line([[wx+4,y+42],[wx+26,y+42]],'#fff6e7',3)}roundRect(x+w/2-13,y+h.h-43,26,43,7,'#986d82');ellipse(x+w/2+7,y+h.h-23,2.3,2.3,'#ffdf87');for(let j=0;j<6;j++)ellipse(x+12+j*(w-24)/5,y+7,2.3,2.3,'#fff9b6');if(h.done){ctx.font='29px sans-serif';ctx.fillText('✨',x+w/2-15,y-76)}ctx.restore()}
function drawCloud(c){const x=c.x+c.w/2,y=c.y,w=c.w,h=c.h;ctx.save();ctx.shadowColor='#c4dcff77';ctx.shadowBlur=17;ellipse(x,y+7,w*.39,h*.38,'#b4c8e5');ellipse(x-w*.25,y+7,w*.28,h*.39,'#eaf4ff');ellipse(x+w*.23,y+5,w*.29,h*.42,'#eaf4ff');ellipse(x-w*.02,y-h*.18,w*.28,h*.49,'#f9fcff');ctx.shadowBlur=0;ellipse(x-w*.17,y-4,w*.16,h*.19,'#ffffff88');ctx.restore()}
function drawGift(g){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(Math.sin(g.rot)*.18);ctx.shadowColor='#ffdc9c';ctx.shadowBlur=10;roundRect(-12,-11,24,22,4,'#f35c84');roundRect(-3,-11,6,22,1,'#ffdf83');roundRect(-12,-3,24,6,1,'#ffdf83');ellipse(-4,-13,6,3,'#ffdf83');ellipse(4,-13,6,3,'#ffdf83');ctx.restore()}
function drawReindeer(x,y){ctx.save();ctx.translate(x,y); // Facing right: nose and antlers on the right
// legs and body
ellipse(-5,4,38,22,'#9d603e');ellipse(-9,-2,30,17,'#bd8154');for(const lx of [-26,10]){line([[lx,17],[lx-2,37],[lx+7,40]],'#70482e',7);ellipse(lx+8,40,6,3,'#493329')}
// neck, head and muzzle
ellipse(24,-12,15,27,'#b87a50');ellipse(39,-29,24,17,'#b87a50');ellipse(53,-23,17,10,'#e6ad7d');ellipse(66,-24,6,5,'#e94961');ellipse(43,-34,3.3,4,'#2d2836');ellipse(44,-35,1.1,1.3,'#fff');ellipse(23,-44,11,6,'#9d603e');
// branching antlers
line([[32,-42],[25,-69],[15,-77]],'#e9c18a',5);line([[25,-65],[38,-76]],'#e9c18a',4);line([[41,-43],[48,-70],[60,-80]],'#e9c18a',5);line([[48,-65],[36,-75]],'#e9c18a',4);roundRect(10,-4,7,17,2,'#eecb72');ctx.restore()}
function drawSanta(){ctx.save();ctx.translate(santa.x,santa.y);if(santa.immune>0&&Math.floor(santa.immune*12)%2===0)ctx.globalAlpha=.55;
// sparkling reins and two reindeer pulling to the right
line([[19,20],[76,10],[108,3]],'#f9e6bd',3);drawReindeer(117,-9); // sleigh runners
line([[-67,43],[-52,53],[32,53],[48,43]],'#f5d8a2',6);line([[-60,47],[39,47]],'#f5d8a2',3);
// sack and sleigh
ellipse(-47,-5,32,35,'#a974b8');ellipse(-46,-13,26,26,'#c79cdb');roundRect(-73,-16,45,9,4,'#e7c9ed');ctx.fillStyle='#c84262';ctx.beginPath();ctx.moveTo(-70,12);ctx.quadraticCurveTo(-65,43,-25,44);ctx.lineTo(26,44);ctx.quadraticCurveTo(44,34,39,10);ctx.lineTo(27,24);ctx.lineTo(-57,24);ctx.closePath();ctx.fill();line([[-64,30],[24,30]],'#ffd79b',5);ellipse(30,25,7,7,'#ffe2a1');
// Santa body and arms
ellipse(-2,4,29,31,'#e84b65');ellipse(-2,7,23,24,'#f35b72');roundRect(-26,14,50,8,4,'#553b4b');roundRect(-6,12,12,13,3,'#ffd78d');ellipse(18,12,13,9,'#ed5971');ellipse(30,15,8,8,'#fff7e9');
// head, beard and face
ellipse(1,-34,23,24,'#ffe0bc');ellipse(1,-18,23,17,'#fff9ed');ellipse(1,-34,18,17,'#ffe0bc');ellipse(13,-29,4,4,'#f8a4a5');ellipse(-5,-34,2.5,3.6,'#3d3344');ellipse(10,-34,2.5,3.6,'#3d3344');ellipse(-5,-35,1,1,'#fff');ellipse(10,-35,1,1,'#fff');ellipse(-10,-27,5,3,'#f5a3a5');ellipse(17,-27,5,3,'#f5a3a5');ctx.strokeStyle='#9e5961';ctx.lineWidth=2;ctx.beginPath();ctx.arc(3,-27,6,.2,Math.PI-.2);ctx.stroke();ellipse(3,-23,8,5,'#fff9ed');
// hat and pom-pom
ctx.fillStyle='#d93f60';ctx.beginPath();ctx.moveTo(-24,-47);ctx.quadraticCurveTo(-18,-80,8,-72);ctx.quadraticCurveTo(23,-67,26,-51);ctx.closePath();ctx.fill();roundRect(-25,-53,49,11,6,'#fffaf2');ellipse(25,-54,9,9,'#fffaf2');ctx.restore()}
function draw(){drawSky();for(const h of houses)drawHouse(h);for(const c of clouds)drawCloud(c);for(const g of gifts)drawGift(g);drawSanta();for(const p of effects){ctx.globalAlpha=clamp(p.t/.75,0,1);ellipse(p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1;for(const s of snow){ctx.globalAlpha=s.a;ellipse(s.x,s.y,s.r,s.r,'#fff')}ctx.globalAlpha=1;if(mode==='playing'){roundRect(15,14,205,35,17,'#132347aa');ctx.fillStyle='#ffe7a7';ctx.font='bold 17px system-ui';ctx.fillText('🎁 次の配達 ×'+Math.min(combo+1,10),30,37)}}function frame(t){let dt=Math.min(.033,Math.max(0,(t-last)/1000||0));last=t;if(mode==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
